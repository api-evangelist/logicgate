aid: logicgate
name: LogicGate
description: >-
  LogicGate is the maker of Risk Cloud, a no-code governance, risk, and compliance
  (GRC) platform that lets teams design, automate, and connect their risk and
  compliance programs. The Risk Cloud API v2 is an API-first, RESTful interface for
  managing the building blocks of a Risk Cloud environment - Applications, Workflows,
  Workflow Maps, Steps, Paths (edge/next/redirect), Fields, Records, and Access
  Audits - so organizations can integrate, automate, and build custom workflows
  against their risk data. Authentication is an HTTP bearer "API Token" minted via
  HTTP basic against the token endpoint, and API access requires the paid API Access
  add-on. The v2 OpenAPI 3.1 specification is published on GitHub as the single
  source of truth, alongside a Postman collection and interactive documentation.
